name: InkTwin CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime & dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint with ruff
        run: ruff check src tests
      - name: Run fast unit tests
        run: python tests/test_unit_core.py
      - name: Build standalone wheel and smoke-test CLI
        run: |
          python -m pip wheel . --no-deps -w /tmp/wheelhouse
          pip install --force-reinstall --no-deps /tmp/wheelhouse/*.whl
          cd /tmp
          python -m inktwin doctor --json
          python -m inktwin packs --json

