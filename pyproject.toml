[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "inktwin"
version = "0.1.0"
description = "Offline personal handwriting twin & math/physics vector typesetting engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf",
    "pillow",
    "numpy",
    "pyyaml",
    "markdown-it-py",
    "fonttools",
]

[project.scripts]
inktwin = "inktwin.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]
mcp = ["mcp>=1.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
inktwin = [
    "assets/data/*.gz",
    "assets/fonts/*.ttf",
    "assets/fonts/*.otf",
    "assets/fonts/*.woff2",
    "assets/katex/*",
    "assets/katex/fonts/*",
    "assets/templates/*.pdf",
    "packs/*.hwpack",
    "renderer/js/*.js",
    "renderer/css/*.css",
    "scene/*.html",
    "studio/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 128
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true

